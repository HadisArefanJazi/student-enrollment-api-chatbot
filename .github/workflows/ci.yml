name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q app examples
      - run: pytest
      - run: python -m build
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "from app.main import app; from app.repositories.enrollment import EnrollmentRepository; assert EnrollmentRepository().get_enrollment(2025).students == 1650"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t enrollment-api .
      - name: Verify container health and enrollment endpoint
        shell: bash
        run: |
          docker run -d --name enrollment-api -p 8000:8000 enrollment-api
          trap 'docker logs enrollment-api; docker rm -f enrollment-api' EXIT
          curl --retry 20 --retry-delay 1 --retry-all-errors --max-time 3 --retry-max-time 30 --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/enrollments/2025 | python -c 'import json, sys; assert json.load(sys.stdin) == {"year": 2025, "students": 1650}'
          test "$(docker exec enrollment-api id -u)" != "0"
