[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-enrollment-api-chatbot"
version = "0.1.0"
description = "FastAPI application and terminal chatbot for querying student enrollment data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hadis Arefanjazi" }
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<8.0",
  "httpx>=0.24"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
