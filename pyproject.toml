[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-enrollment-api-chatbot"
version = "1.0.0"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "uvicorn>=0.27,<1",
    "requests>=2.31,<3",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
enrollment-chatbot = "app.chatbot:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
